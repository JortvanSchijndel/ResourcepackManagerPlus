# The API key for authenticating requests from the Resourcepack Manager.
api-key: "your-secret-api-key"

# The port for the embedded HTTP server.
port: 8080

# The public IP address of the Minecraft server.
server-ip: "127.0.0.1"

# The only URL from which the plugin will accept resource packs.
allowed-url: ""

# Whether to enable debug mode.
debug: false

# Model Viewer Settings
model-viewer:
  # Whether to animate items appearing in the GUI
  animation-enabled: true
  # Duration of the animation in seconds
  animation-duration: 1.5
  # The base material to use for displaying models
  base-item: "LEATHER_HORSE_ARMOR"
