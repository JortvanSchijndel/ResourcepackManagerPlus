name: ResourcepackManager
version: '1.0-SNAPSHOT'
main: org.jortvanschijndel.resourcepackManager.ResourcepackManager
api-version: '1.21'

depend:
  - BKCommonLib

commands:
  rmp:
    description: Main command for ResourcepackManager
    aliases: [resourcepackmanagerplus]
    permission: resourcepackmanager.use
  give-model:
    description: Give a custom model item
    usage: /give-model <item> <category> <model>
    permission: resourcepackmanager.give-model
  models:
    description: Open the model viewer GUI
    usage: /models [search]
    permission: resourcepackmanager.model-viewer

permissions:
  resourcepackmanager.use:
    description: Allows using the main command.
    default: op
  resourcepackmanager.reload:
    description: Allows reloading the plugin's configuration.
    default: op
  resourcepackmanager.status:
    description: Allows checking the plugin's status.
    default: op
  resourcepackmanager.seturl:
    description: Allows setting the allowed URL.
    default: op
  resourcepackmanager.debug:
    description: Allows toggling debug mode.
    default: op
  resourcepackmanager.give-model:
    description: Allows giving custom model items.
    default: op
  resourcepackmanager.model-viewer:
    description: Allows opening the model viewer.
    default: op
