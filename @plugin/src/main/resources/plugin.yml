name: ResourcepackManagerPlugin
version: 1.0.0
main: org.jortvanschijndel.resourcepackmanager.ResourcepackManager
api-version: 1.21
author: Jort van Schijndel
description: Integrates with the web-based Resourcepack Manager to handle server-side resource packs.
commands:
  rp-reload:
    description: Reloads the plugin's configuration.
    permission: resourcepackmanager.admin
  rp-status:
    description: Checks the status of the resource pack system.
    permission: resourcepackmanager.admin
  rp-seturl:
    description: Sets the allowed URL for resource pack downloads.
    usage: "/rp-seturl <url>"
    permission: resourcepackmanager.admin
  rp-debug:
    description: Toggles web server debug logging.
    permission: resourcepackmanager.admin
permissions:
  resourcepackmanager.admin:
    description: Grants access to all ResourcepackManager commands.
    default: op
